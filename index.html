<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google needs a square icon in a multiple of 48px (PNG/ICO are the most reliable); the SVG is for browsers. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icons/favicon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"BallotPolls","alternateName":"Ballot Polls","url":"https://www.ballotpolls.com/"}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BallotPolls | Run an election people vote in from any phone</title>
    <meta name="description" content="Run an election anyone can vote in from a basic phone. Voters dial a short code and pay by mobile money." />
    <!-- Share-link crawlers (WhatsApp, Facebook) do not run scripts, so they read these defaults. -->
    <meta property="og:site_name" content="BallotPolls" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BallotPolls | Run an election people vote in from any phone" />
    <meta property="og:description" content="Voters dial a short code and pay by mobile money. Set up categories and candidates and follow results live." />
    <meta property="og:image" content="https://ballotpolls.com/og/banner.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#10201B" />
    <!-- Lets the site be installed as an app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BallotPolls" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
